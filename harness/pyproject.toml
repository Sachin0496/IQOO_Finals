[project]
name = "mouna-harness"
version = "0.1.0"
description = "Evaluation harness for the Mouna feasibility spike"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["mouna_harness"]  # vectors/ is data, not a package
