<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouna calls</title>
<style>
  :root { --bg:#0e0d0b; --bone:#ede6d6; --bone2:#b9b2a3; --turmeric:#f0aa2e; }
  html, body { margin:0; background:var(--bg); color:var(--bone); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:30rem; margin:0 auto; padding:18vh 24px 48px; }
  h1 { font:400 2.4rem/1.1 Georgia, 'Times New Roman', serif; margin:0 0 .6em; }
  p { color:var(--bone2); }
  b { color:var(--turmeric); font-weight:500; }
</style>
</head>
<body>
<main>
  <h1>Mouna</h1>
  <p>Mouna gives a voice to people who cannot speak. If someone sent you a link or a QR code to a call, open that link: there is nothing to install.</p>
  <p><b>This is the call relay.</b> It passes the call between the two phones and keeps no audio and no text.</p>
</main>
</body>
</html>
